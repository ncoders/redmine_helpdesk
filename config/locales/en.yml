  label_helpdesk_subject_prefix: "Subject prefix"
  text_helpdesk_subject_prefix: "Issue references in mail subjects become [PREFIX #1234]. Incoming mails only update an issue if the subject carries this prefix, so references of other ticket systems like [Other #1234] are ignored. Leave empty to keep the standard Redmine behaviour."
